<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfumer-LAB 시안</title>
<!-- 시안 전용(5-0). 토큰 값은 app/tailwind.config.js와 같다. 데이터는 모두 가상(누가 봐도 가짜인 이름). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=block" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E8;--surface:#FBF9F4;--surfaceAlt:#EDE7DA;--primary:#1F3D2E;--primaryHover:#2B5240;
  --accent:#B08D57;--accentStrong:#866634;--accentSoft:#E8DCC4;--text:#1C1C1A;--textSub:#62625E;
  --onPrimary:#F5F1E8;--onAccent:#1C1C1A;--border:#D9D2C3;
  --noteTop:#A8B5A0;--noteMiddle:#C9A9A0;--noteBase:#7A5C48;--onNoteTop:#1C1C1A;--onNoteMiddle:#1C1C1A;--onNoteBase:#F5F1E8;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141614;--surface:#1D201D;--surfaceAlt:#262A26;--primary:#8FAE98;--primaryHover:#A3C0AB;
  --accent:#C9A66B;--accentStrong:#C9A66B;--accentSoft:#3A3226;--text:#EFEDE6;--textSub:#A3A39E;
  --onPrimary:#141614;--onAccent:#141614;--border:#333833;--onNoteTop:#141614;--onNoteMiddle:#141614;--onNoteBase:#EFEDE6;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Pretendard,system-ui,sans-serif;font-size:16px;line-height:24px;font-variant-numeric:tabular-nums}
.serif{font-family:"Noto Serif KR",serif}
.display{font-family:"Noto Serif KR",serif;font-size:28px;line-height:36px;font-weight:600}
.title{font-family:"Noto Serif KR",serif;font-size:22px;line-height:30px;font-weight:600}
.headline{font-size:18px;line-height:26px;font-weight:600}
.label{font-size:14px;line-height:20px;font-weight:500}
.caption{font-size:12px;line-height:16px;color:var(--textSub)}
.sub{color:var(--textSub)}
.layer{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.12em}
.icon{font-family:"Material Symbols Outlined";font-size:24px;line-height:1;font-variation-settings:"wght" 300}
/* 틀 */
.app{min-height:100vh;display:flex}
.nav{display:none}
.main{flex:1;min-width:0;padding:16px 24px 96px}
.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:16px}
.top .icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-left:-12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--textSub);font-size:12px;line-height:16px;min-height:56px}
.tab.on{color:var(--primary);font-weight:600}
.tab.on .icon{border-bottom:2px solid var(--primary);padding-bottom:2px}
section{margin-top:32px}
.stack>*+*{margin-top:8px}
/* 컴포넌트 */
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:4px;font-size:14px;line-height:20px;font-weight:500;border:1px solid var(--primary)}
.btn.pri{background:var(--primary);color:var(--onPrimary)}
.btn.sec{color:var(--primary);background:transparent}
.btn.txt{border:0;color:var(--primary);padding:0 8px;justify-content:flex-start}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px}
.input{display:flex;align-items:center;gap:8px;background:var(--surfaceAlt);border-radius:4px;min-height:48px;padding:0 12px;color:var(--textSub)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:2px;font-size:14px;line-height:20px;font-weight:500;margin:6px 6px 0 0}
.chip.top{background:var(--noteTop);color:var(--onNoteTop)}
.chip.middle{background:var(--noteMiddle);color:var(--onNoteMiddle)}
.chip.base{background:var(--noteBase);color:var(--onNoteBase)}
.chip.line{background:transparent;border:1px solid var(--border);color:var(--text)}
.chip.picked{outline:1px solid var(--text)}
.chip.fam.on{background:var(--accentSoft);border-color:var(--accentStrong)}
.ochip{display:inline-block;border:1px solid var(--border);border-radius:2px;padding:1px 6px;font-size:12px;line-height:16px;color:var(--textSub);margin:4px 4px 0 0}
.ticks{display:inline-flex;gap:2px;align-items:flex-end}
.ticks i{display:block;width:2px;height:12px;background:currentColor;opacity:.25}
.ticks i.f{opacity:1}
.grade{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.grade.vs{background:var(--accent);color:var(--onAccent)}
.grade.s{border:1px solid var(--accentStrong);color:var(--accentStrong)}
.grade.r{color:var(--textSub);padding:0}
.bar{height:6px;background:var(--surfaceAlt)}
.bar>b{display:block;height:6px}
.bar.me>b{background:var(--primary)}.bar.pf>b{background:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hr{border-top:1px solid var(--border)}
.seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.seg span{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--textSub)}
.seg span.on{background:var(--primary);color:var(--onPrimary)}
.layertabs{display:flex;border-bottom:1px solid var(--border)}
.layertabs span{flex:1;text-align:center;padding:12px 0;min-height:48px}
.layertabs span.on{border-bottom:2px solid var(--primary);color:var(--primary)}
/* 처방전 (이 앱에서 강조하는 하나) */
.rx{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px}
.rx-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--text);padding-bottom:12px}
.rx-layer{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--border)}
.rx-layer:last-child{border-bottom:0;padding-bottom:0}
.rx-note{display:flex;justify-content:space-between;align-items:center;min-height:32px}
.rx-note .serif{font-size:18px;line-height:26px;font-weight:500}
.rx-str{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--textSub)}
.lt{color:var(--noteBase)}
.dot{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;vertical-align:middle}
/* 목록·상세 */
.rec{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--border)}
.rec .rank{font-size:14px;color:var(--textSub);padding-top:2px}
.rec.sel{background:var(--surface)}
.pyr{display:grid;grid-template-columns:72px 1fr;gap:8px 16px;align-items:center}
.match{font-size:12px;color:inherit;font-weight:600;margin-left:4px}
.hint{background:var(--accentSoft);padding:12px 16px;border-radius:4px;font-size:14px;line-height:20px}
.detail{display:none}
.banner{background:var(--accentSoft);color:var(--text);font-size:12px;line-height:16px;padding:6px 24px}
/* PC */
@media (min-width:1024px){
  .tabs{display:none}
  .nav{display:flex;flex-direction:column;width:240px;flex:none;border-right:1px solid var(--border);padding:24px 16px;gap:4px;min-height:100vh;background:var(--bg)}
  .nav .brand{font-family:"Noto Serif KR",serif;font-size:18px;font-weight:600;padding:0 12px 24px}
  .nav a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:4px;color:var(--textSub);font-size:14px;font-weight:500;text-decoration:none}
  .nav a.on{color:var(--primary);background:var(--surface);border:1px solid var(--border);font-weight:600}
  .main{padding:32px 40px}
  .page{max-width:1120px}
  .split{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
  .split .detail{display:block;position:sticky;top:32px}
  .narrow{max-width:640px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = [
  ["Demo Atelier","Sample No. 12",0.82,"vs",["시트러스","플로럴","우디"]],
  ["Placeholder Parfums","Test Cedar",0.79,"vs",["우디","시트러스","프레시"]],
  ["Sample Maison","Mock Bergamot Water",0.74,"s",["시트러스","프레시","머스키"]],
  ["Demo Atelier","Sample No. 7",0.71,"s",["플로럴","시트러스","파우더리"]],
  ["Fictive & Co.","Dummy Rose Wood",0.68,"s",["플로럴","우디","스파이시"]],
  ["Lorem Perfumery","Ipsum Musk",0.63,"r",["머스키","플로럴","우디"]],
];
const notes = {top:[["레몬",3],["베르가못",2]],middle:[["장미",2],["자스민",1]],base:[["샌달우드",1],["머스크",2]]};
const strK = ["","약","중","강"];
const ticks = n => `<span class="ticks" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span>`;
const icon = n => `<span class="icon" aria-hidden="true">${n}</span>`;
const tabs = on => `<nav class="tabs">${[["home","홈"],["search","향수 찾기"],["bookmark","보관함"],["person","마이"]].map(([i,t],k)=>`<div class="tab ${k===on?'on':''}">${icon(i)}<span>${t}</span></div>`).join('')}</nav>`;
const nav = on => `<aside class="nav"><div class="brand">Perfumer-LAB</div>${[["home","홈"],["search","향수 찾기"],["bookmark","보관함"],["person","마이"]].map(([i,t],k)=>`<a class="${k===on?'on':''}">${icon(i)}${t}</a>`).join('')}</aside>`;
const grade = g => g==="vs"?`<span class="grade vs">매우 비슷</span>`:g==="s"?`<span class="grade s">비슷</span>`:`<span class="grade r">참고</span>`;
const accords = [["시트러스",44,38],["플로럴",21,24],["우디",18,22],["머스키",9,6],["프레시",8,10]];

function home(){return `
<div class="top"><h1 class="display">새 조합을<br>만들어 볼까요</h1></div>
<p class="sub narrow">탑 · 미들 · 베이스에서 노트를 골라 조합하면, 어코드 비중이 가장 비슷한 향수를 보여 드려요.</p>
<section><div class="btns narrow"><div class="btn pri">새 조합 만들기</div></div></section>
<section class="narrow"><h2 class="headline">최근 조합</h2>
 <div class="stack" style="margin-top:12px">
  <div class="card"><div class="row"><span class="serif" style="font-size:18px;font-weight:500">아침 시트러스</span><span class="caption">11월 10일</span></div>
   <div class="caption" style="margin-top:4px">레몬 · 베르가못 · 장미 · 샌달우드 외 2개</div></div>
  <div class="card"><div class="row"><span class="serif" style="font-size:18px;font-weight:500">비 온 뒤 숲</span><span class="caption">11월 8일</span></div>
   <div class="caption" style="margin-top:4px">갈바넘 · 아이리스 · 베티버</div></div>
 </div></section>
<section class="narrow"><h2 class="headline">탑 · 미들 · 베이스가 뭔가요?</h2>
 <p class="sub" style="margin-top:8px">뿌린 직후 먼저 나는 향이 탑, 한두 시간 이어지는 중심이 미들, 마지막까지 남는 잔향이 베이스예요.</p>
 <div class="btn txt" style="margin-top:4px">첫 실행 안내 다시 보기</div></section>`}

function notesScreen(){return `
<div class="top">${icon("arrow_back")}<h1 class="headline">노트 고르기</h1><span class="caption" style="margin-left:auto">2 / 3단계</span></div>
<div class="layertabs label"><span class="on">TOP 2</span><span>MIDDLE 2</span><span>BASE 2</span></div>
<section style="margin-top:16px">
 <div class="input">${icon("search")}<span>노트 이름으로 찾기 (예: 베르가, berg)</span></div>
 <div style="margin-top:16px"><div class="caption">고른 노트 · 층마다 3개까지</div>
  <span class="chip top picked">✓ 레몬 ${ticks(3)} 강</span><span class="chip top picked">✓ 베르가못 ${ticks(2)} 중</span></div>
 <div class="card" style="margin-top:16px"><div class="row"><span class="headline serif">레몬</span><span class="caption">시트러스</span></div>
  <p class="caption" style="margin:4px 0 12px">밝고 시큼한 첫인상. 금방 날아가요.</p>
  <div class="seg" role="radiogroup" aria-label="레몬 강도"><span>약</span><span>중</span><span class="on">강</span></div></div>
</section>
<section><h2 class="label sub">시트러스 · 많이 쓰는 노트</h2>
 <div><span class="chip line">자몽</span><span class="chip line">만다린</span><span class="chip line">라임</span><span class="chip line">유자</span><span class="chip line">비터 오렌지</span><span class="chip line">네롤리</span></div></section>
<section><h2 class="label sub">그린 · 많이 쓰는 노트</h2>
 <div><span class="chip line">녹차</span><span class="chip line">갈바넘</span><span class="chip line">바질</span><span class="chip line">민트</span></div></section>
<section><div class="btns"><div class="btn pri">조합 요약 보기</div></div></section>`}

function summary(){return `
<div class="top">${icon("arrow_back")}<h1 class="headline">조합 요약</h1></div>
<div class="narrow">
<div class="rx">
 <div class="rx-head"><span class="title">아침 시트러스</span><span class="caption">노트 6개</span></div>
 ${["top","middle","base"].map(l=>`<div class="rx-layer"><div class="layer" style="padding-top:8px"><span class="dot" style="background:var(--note${l[0].toUpperCase()+l.slice(1)})"></span>${l.toUpperCase()}</div>
  <div>${notes[l].map(([n,s])=>`<div class="rx-note"><span class="serif">${n}</span><span class="rx-str">${ticks(s)}<span>${strK[s]}</span></span></div>`).join('')}</div></div>`).join('')}
</div>
<section><h2 class="headline">이 조합의 어코드</h2><p class="caption" style="margin-top:4px">메인 테마 추정치예요. 실제로 섞은 향을 예측한 값은 아니에요.</p>
 <div class="stack" style="margin-top:16px">${accords.map(([a,m])=>`<div><div class="row label"><span>${a}</span><span class="num">${m}%</span></div><div class="bar me" style="margin-top:4px"><b style="width:${m*2}%"></b></div></div>`).join('')}</div></section>
<section><div class="hint">시트러스 느낌이 가장 앞서는 조합이에요. 베이스가 가벼워 잔향은 짧게 느껴질 수 있어요.</div></section>
<section><div class="btns"><div class="btn pri">추천 보기</div></div><div class="btns" style="margin-top:8px"><div class="btn sec">노트 수정</div><div class="btn sec">저장</div></div></section>
</div>`}

function recList(sel){return `
<div class="top">${icon("arrow_back")}<h1 class="headline">비슷한 향수</h1></div>
<p class="caption">아침 시트러스 · 데이터상 유사도 순</p>
<div style="margin-top:8px" class="hr">${P.map(([b,n,s,g,ac],i)=>`<div class="rec ${sel&&i===0?'sel':''}"><span class="rank">${i+1}</span>
 <div><div class="caption" style="color:var(--textSub)">${b}</div><div class="headline serif" style="font-weight:600">${n}</div><div>${ac.map(a=>`<span class="ochip">${a}</span>`).join('')}</div></div>
 <div style="text-align:right"><div class="num label">${Math.round(s*100)}%</div><div style="margin-top:6px">${grade(g)}</div></div></div>`).join('')}</div>
<p class="caption" style="margin-top:16px">가상 데이터로 만든 시안이에요.</p>`}

function detail(){const [b,n,s,g]=P[0];return `
<div class="caption">${b}</div><h1 class="title" style="margin-top:2px">${n}</h1>
<div style="display:flex;gap:8px;align-items:center;margin-top:8px">${grade(g)}<span class="label num">데이터상 유사도 ${Math.round(s*100)}%</span></div>
<section><h2 class="headline">노트</h2><div class="pyr" style="margin-top:12px">
 <span class="layer">TOP</span><div><span class="chip top">레몬<span class="match">✓ 내 조합</span></span><span class="chip top">만다린</span><span class="chip top">핑크 페퍼</span></div>
 <span class="layer">MIDDLE</span><div><span class="chip middle">장미<span class="match">✓ 내 조합</span></span><span class="chip middle">은방울꽃</span></div>
 <span class="layer">BASE</span><div><span class="chip base">샌달우드<span class="match">✓ 내 조합</span></span><span class="chip base">앰버</span></div></div></section>
<section><h2 class="headline">어코드 비교</h2>
 <div class="caption" style="margin-top:4px"><span class="dot" style="background:var(--primary)"></span>내 조합 <span class="dot" style="background:var(--accent);margin-left:12px"></span>이 향수</div>
 <div class="stack" style="margin-top:12px">${accords.map(([a,m,p])=>`<div><div class="row label"><span>${a}</span><span class="num">${m}% · ${p}%</span></div><div class="bar me" style="margin-top:4px"><b style="width:${m*2}%"></b></div><div class="bar pf" style="margin-top:2px"><b style="width:${p*2}%"></b></div></div>`).join('')}</div></section>
<section><div class="btns"><div class="btn pri">찜하기</div><div class="btn sec">시향 기록</div></div>
 <div class="btn txt" style="margin-top:8px">추천이 이상해요</div>
 <p class="caption" style="margin-top:8px">데이터: 가상 샘플 · 강도는 함량이 아니라 커뮤니티가 느낀 강도예요.</p></section>`}

const screens = {
  home:  () => [0, home()],
  notes: () => [0, notesScreen()],
  summary: () => [0, summary()],
  recs:  () => [0, `<div class="split"><div>${recList(true)}</div><div class="detail card" style="padding:32px">${detail()}</div></div>`],
  detail: () => [0, `<div class="top">${icon("arrow_back")}<span class="label">비슷한 향수</span></div>${detail()}`],
};
const key = (location.hash.replace('#','')||'home');
const [on, body] = screens[key]();
document.getElementById('root').innerHTML =
  `<div class="banner">가상 데이터 · 시안</div><div class="app">${nav(on)}<main class="main"><div class="page">${body}</div></main></div>${tabs(on)}`;
</script>
</body>
</html>
